name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  billing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/billing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff mypy pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  reports:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install flake8 black pytest
      - run: flake8
      - run: black --check .
      - run: pytest -q
