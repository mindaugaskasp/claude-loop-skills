[project]
name = "repaircafe"
version = "0.7.2"
description = "Bookings for the Saturday repair café"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "UP"]
