[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nudge"
version = "0.4.0"
description = "Appointment reminders by text message for a small clinic"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nudge = "nudge.cli:main"

[tool.setuptools]
packages = ["nudge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4",
    "E9",
    "F",
    "I",
    "E722", # no bare except (improvement loop, October)
    "T20",  # no print in library code (improvement loop, November)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
